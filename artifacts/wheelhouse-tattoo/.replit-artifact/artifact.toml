kind = "web"
previewPath = "/"
title = "Wheelhouse Tattoo Co."
version = "1.0.0"
id = "artifacts/wheelhouse-tattoo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21226

[services.development]
run = "pnpm --filter @workspace/wheelhouse-tattoo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wheelhouse-tattoo", "run", "build" ]
publicDir = "artifacts/wheelhouse-tattoo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21226"
BASE_PATH = "/"
